version: '3.8'

services:
  innerloop-service:
    # Use pre-built image from GitHub Container Registry (recommended)
    # image: ghcr.io/joshspicer/innerloop:latest
    # Or build locally from source
    build: .
    container_name: innerloop-service
    ports:
      - "7990:7990"
    environment:
      - NODE_ENV=production
      - PORT=7990
      - DATABASE_PATH=/app/data/innerloop.db
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      # GitHub Plugin Configuration (optional)
      - PLUGIN_GITHUB_TOKEN=${PLUGIN_GITHUB_TOKEN:-}
      - PLUGIN_GITHUB_OWNER=${PLUGIN_GITHUB_OWNER:-}
      - PLUGIN_GITHUB_REPO=${PLUGIN_GITHUB_REPO:-}
      - PLUGIN_GITHUB_ASSIGNEES=${PLUGIN_GITHUB_ASSIGNEES:-}
      - PLUGIN_GITHUB_LABELS=${PLUGIN_GITHUB_LABELS:-}
      - PLUGIN_GITHUB_CREATE_ISSUE_ON_ERROR=${PLUGIN_GITHUB_CREATE_ISSUE_ON_ERROR:-false}
      - PLUGIN_GITHUB_CREATE_ISSUE_ON_BATCH=${PLUGIN_GITHUB_CREATE_ISSUE_ON_BATCH:-true}
    volumes:
      - innerloop-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:7990/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  innerloop-data:
    driver: local
